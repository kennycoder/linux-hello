name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Debian Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopencv-dev \
            libpam0g-dev \
            clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Build Debian Package
        run: make deb VERSION="${{ steps.vars.outputs.version }}"

      - name: Generate Checksums
        run: |
          cd target
          sha256sum linux-hello_${{ steps.vars.outputs.version }}_amd64.deb > linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

