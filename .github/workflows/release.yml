name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopencv-dev \
            libpam0g-dev \
            clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Build Debian Package
        run: make deb VERSION="${{ steps.vars.outputs.version }}"

      - name: Generate Checksums
        run: |
          cd target
          sha256sum linux-hello_${{ steps.vars.outputs.version }}_amd64.deb > linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      # -------------------------------------------------------------
      # Setup APT Repository via GitHub Pages
      # -------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create APT repository
        uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: linux-hello
          scan-dir: target
          codename: stable
          components: main
          architectures: amd64
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          # Imports previous packages from live GitHub Pages so old releases remain available
          import-from-repo-failure-allow: true
          import-from-repo-url: |
            deb-amd64 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ stable main

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.apt-repo.outputs.dir }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4