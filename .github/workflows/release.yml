name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopencv-dev \
            libpam0g-dev \
            clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Build Debian Package
        run: make deb VERSION="${{ steps.vars.outputs.version }}"

      - name: Generate Checksums
        run: |
          cd target
          sha256sum linux-hello_${{ steps.vars.outputs.version }}_amd64.deb > linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

  build-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            rust \
            cargo \
            gcc-c++ \
            make \
            pkgconfig \
            opencv-devel \
            pam-devel \
            polkit-devel \
            clang-devel \
            cmake \
            extra-cmake-modules \
            kf6-kcoreaddons-devel \
            tar \
            gzip

      - name: Prepare RPM build tree and source tarball
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          rpmdev-setuptree
          # Update version in spec file
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/fedora/linux-hello.spec
          cp packaging/fedora/linux-hello.spec ~/rpmbuild/SPECS/
          # Create source tarball
          git archive --format=tar.gz --prefix=linux-hello-${VERSION}/ -o ~/rpmbuild/SOURCES/linux-hello-${VERSION}.tar.gz HEAD

      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/linux-hello.spec

      - name: Copy RPM and generate checksum
        run: |
          mkdir -p target-rpm
          find ~/rpmbuild/RPMS -type f -name "*.rpm" -exec cp {} target-rpm/ \;
          cd target-rpm
          for f in *.rpm; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: target-rpm/*

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Arch environment and build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            cargo \
            opencv \
            pam \
            polkit \
            hicolor-icon-theme \
            cmake \
            extra-cmake-modules \
            clang \
            pkgconf \
            git

          # makepkg cannot run as root, create builder user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          cd packaging/arch
          # Update version and make source point to current checkout
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          # Package using local source directory
          su builder -c "
            export CARGO_HOME=/home/builder/.cargo
            makepkg -sf --noconfirm --nodeps
          "

      - name: Copy Arch packages and generate checksum
        run: |
          mkdir -p target-arch
          find packaging/arch -type f -name "*.pkg.tar.*" -exec cp {} target-arch/ \;
          cd target-arch
          for f in *.pkg.tar.*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: target-arch/*

  publish-release:
    name: Publish Release & Deploy APT Repo
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-arch]

    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.*" -o -name "*.sha256" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      # -------------------------------------------------------------
      # Setup APT Repository via GitHub Pages (Debian/Ubuntu)
      # -------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create APT repository
        uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: linux-hello
          scan-dir: artifacts/debian-packages
          codename: stable
          components: main
          architectures: amd64
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          import-from-repo-failure-allow: true
          import-from-repo-url: |
            deb-amd64 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ stable main

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.apt-repo.outputs.dir }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: publish-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
