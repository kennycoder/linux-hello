name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deb:
    name: Build Debian 13 & Ubuntu 26.04 (.deb + KCM)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libopencv-dev \
            libpam0g-dev \
            clang \
            cmake \
            extra-cmake-modules \
            qt6-base-dev \
            qt6-declarative-dev \
            libkf6coreaddons-dev \
            libkf6kcmutils-dev \
            libkf6i18n-dev \
            gettext

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Build Debian Package (Debian 13 / Ubuntu 26.04)
        run: make deb VERSION="${{ steps.vars.outputs.version }}" REQUIRE_KCM=1

      - name: Generate Checksums
        run: |
          cd target
          sha256sum linux-hello_${{ steps.vars.outputs.version }}_amd64.deb > linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb
            target/linux-hello_${{ steps.vars.outputs.version }}_amd64.deb.sha256

  build-deb-lts:
    name: Build Debian 12 & Ubuntu 24.04 LTS (.deb)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libopencv-dev \
            libpam0g-dev \
            clang

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Build Debian Package (Debian 12 / Ubuntu 24.04 LTS)
        run: make deb VERSION="${{ steps.vars.outputs.version }}" DEB_SUFFIX=_debian12-ubuntu24.04

      - name: Generate Checksums
        run: |
          cd target
          sha256sum linux-hello_${{ steps.vars.outputs.version }}_debian12-ubuntu24.04_amd64.deb > linux-hello_${{ steps.vars.outputs.version }}_debian12-ubuntu24.04_amd64.deb.sha256

      - name: Upload Debian LTS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-lts-packages
          path: |
            target/linux-hello_${{ steps.vars.outputs.version }}_debian12-ubuntu24.04_amd64.deb
            target/linux-hello_${{ steps.vars.outputs.version }}_debian12-ubuntu24.04_amd64.deb.sha256

  build-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            rpm-build \
            rpmdevtools \
            rust \
            cargo \
            gcc-c++ \
            make \
            pkgconfig \
            opencv-devel \
            pam-devel \
            polkit-devel \
            clang-devel \
            cmake \
            extra-cmake-modules \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            kf6-kcoreaddons-devel \
            kf6-kcmutils-devel \
            kf6-ki18n-devel \
            gettext \
            tar \
            gzip

      - name: Prepare RPM build tree and source tarball
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          rpmdev-setuptree
          # Update version in spec file
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/fedora/linux-hello.spec
          cp packaging/fedora/linux-hello.spec ~/rpmbuild/SPECS/
          # Create source tarball from workspace directory directly
          tar --exclude="./target*" \
              --exclude="./kde-kcm/build*" \
              --exclude="./.git*" \
              --exclude="*.tar.gz" \
              --transform "s,^\.,linux-hello-${VERSION}," \
              -czf /tmp/linux-hello-${VERSION}.tar.gz .
          mv /tmp/linux-hello-${VERSION}.tar.gz ~/rpmbuild/SOURCES/

      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/linux-hello.spec

      - name: Copy RPM and generate checksum
        run: |
          mkdir -p target-rpm
          find ~/rpmbuild/RPMS -type f -name "*.rpm" ! -name "*-debuginfo-*" ! -name "*-debugsource-*" -exec cp {} target-rpm/ \;
          cd target-rpm
          for f in *.rpm; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: target-rpm/*

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Arch environment and build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            cargo \
            opencv \
            pam \
            polkit \
            hicolor-icon-theme \
            cmake \
            extra-cmake-modules \
            qt6-base \
            qt6-declarative \
            kcoreaddons \
            kcmutils \
            ki18n \
            clang \
            pkgconf \
            git

          # makepkg cannot run as root, create builder user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"

      - name: Build package with makepkg
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          # Create source tarball for makepkg in /tmp to prevent tar from reading its own output
          tar --exclude="./target*" \
              --exclude="./kde-kcm/build*" \
              --exclude="./.git*" \
              --exclude="*.tar.gz" \
              --transform "s,^\.,linux-hello-${VERSION}," \
              -czf /tmp/linux-hello-${VERSION}.tar.gz .
          mv /tmp/linux-hello-${VERSION}.tar.gz packaging/arch/linux-hello-${VERSION}.tar.gz
          chown builder:builder packaging/arch/linux-hello-${VERSION}.tar.gz
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s|source=(.*)|source=(\"linux-hello-${VERSION}.tar.gz\")|" PKGBUILD
          su builder -c "
            export CARGO_HOME=/home/builder/.cargo
            makepkg -sf --noconfirm --nodeps
          "

      - name: Copy Arch packages and generate checksum
        run: |
          mkdir -p target-arch
          find packaging/arch -type f -name "*.pkg.tar.*" ! -name "*-debug-*" -exec cp {} target-arch/ \;
          cd target-arch
          for f in *.pkg.tar.*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: target-arch/*

  publish-release:
    name: Publish Release & Deploy APT Repo
    runs-on: ubuntu-latest
    needs: [build-deb, build-deb-lts, build-rpm, build-arch]

    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.*" -o -name "*.sha256" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      # -------------------------------------------------------------
      # Setup APT Repository via GitHub Pages (Debian/Ubuntu)
      # -------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create APT repository
        uses: morph027/apt-repo-action@v3
        id: apt-repo
        with:
          repo-name: linux-hello
          scan-dir: artifacts/debian-packages
          codename: stable
          components: main
          architectures: amd64
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          import-from-repo-failure-allow: true
          import-from-repo-url: |
            deb-amd64 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ stable main

      - name: Add Landing Page to GitHub Pages
        run: |
          cat << 'EOF' > "${{ steps.apt-repo.outputs.dir }}/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Linux Hello - Official Repository</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #0f172a;
                color: #e2e8f0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
                box-sizing: border-box;
              }
              .card {
                background: #1e293b;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                max-width: 680px;
                width: 100%;
                padding: 36px;
                border: 1px solid #334155;
              }
              h1 {
                margin-top: 0;
                color: #38bdf8;
                font-size: 1.8rem;
                display: flex;
                align-items: center;
                gap: 12px;
              }
              p {
                color: #94a3b8;
                line-height: 1.6;
              }
              pre {
                background: #0f172a;
                border: 1px solid #334155;
                border-radius: 8px;
                padding: 16px;
                overflow-x: auto;
                font-size: 0.95rem;
                color: #f1f5f9;
                line-height: 1.5;
              }
              code {
                color: #38bdf8;
                font-family: monospace;
              }
              a {
                color: #38bdf8;
                text-decoration: none;
              }
              a:hover {
                text-decoration: underline;
              }
              .badge {
                display: inline-block;
                padding: 4px 10px;
                background: #0369a1;
                color: #e0f2fe;
                font-size: 0.8rem;
                border-radius: 9999px;
                font-weight: 600;
                margin-bottom: 12px;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <span class="badge">APT Repository</span>
              <h1>Linux Hello</h1>
              <p>Windows Hello-style facial authentication for Linux desktops using OpenCV and PAM.</p>

              <h3>Debian / Ubuntu Installation</h3>
              <p>Add this repository to your system to receive automatic updates:</p>
              <pre><code># 1. Add repository
          echo "deb [trusted=yes] https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ stable main" | sudo tee /etc/apt/sources.list.d/linux-hello.list

          # 2. Update package list & install
          sudo apt update
          sudo apt install linux-hello</code></pre>

              <h3>Arch Linux &amp; Fedora</h3>
              <p>Precompiled packages (<code>.pkg.tar.zst</code> and <code>.rpm</code>) are available on the <a href="https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases">GitHub Releases</a> page.</p>

              <p style="margin-top: 28px; font-size: 0.85rem; color: #64748b;">
                Source Code &amp; Documentation: <a href="https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}">github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}</a>
              </p>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.apt-repo.outputs.dir }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: publish-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
