[workspace]
members = [
    "crates/linux-hello-camera",
    "crates/linux-hello-core",
    "crates/linux-hellod",
    "crates/pam_linux_hello",
    "crates/linux-hello-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
linux-hello-camera = { path = "crates/linux-hello-camera" }
linux-hello-core = { path = "crates/linux-hello-core" }
clap = { version = "4.5", features = ["derive"] }
cxx = "1.0"
cxx-build = "1.0"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = ["fs", "ioctl", "mman", "poll", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
thiserror = "2.0"

