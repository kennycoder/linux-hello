[package]
name = "linux-hello-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "linux-hello"
path = "src/main.rs"

[dependencies]
linux-hello-camera = { path = "../linux-hello-camera" }
linux-hello-core = { path = "../linux-hello-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
